en:
  theme_metadata:
    description: "Shows anonymous readers a signup CTA at the end of a topic (community value first, product second), so search readers who finish an article are invited to join."
    settings:
      signup_path: "Forum path for the signup CTA. Blank disables the component."
      login_path: "Forum path for the 'Ya tengo cuenta' link."
      ref_value: "Placement name for the Plausible 'CTA Click' event."
      enabled: "Render the CTA."
