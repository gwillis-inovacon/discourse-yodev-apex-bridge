<script>
  (function () {
    // yoDEV Apex Bridge — YOD-479, reworked in YOD-671.
    //
    // YOD-671 (2026-10-02): the CTA now asks for an ACCOUNT, in place, instead
    // of sending the reader to the homepage. Signups had sat at ~20/month
    // (~0.2% of pageviews) for four months; a reader who just finished an
    // article wants more of this, not a product tour. Community value leads,
    // the product is the second line. A forum signup IS a yoDEV account.
    //
    // ~439 anonymous readers a month reach the community from Google, read an
    // article, and leave without learning the product exists. The apex is
    // indexed and healthy but ranks for nothing, because its sitemap holds one
    // URL and nothing has ever pointed at it. This puts a contextual CTA at the
    // end of a topic, for anonymous readers only.
    //
    // Deliberately NOT a redirect. Post URLs must keep landing on the post: the
    // ranking belongs to the article's content, and intercepting search traffic
    // would forfeit it and read as cloaking.
    //
    // Built as manual DOM injection rather than `api.renderInOutlet`, because
    // `<script type="text/discourse-plugin">` was found not to execute on this
    // Discourse setup — the same reason the beta-offer and activation-redirect
    // components inject directly. Settings arrive via CSS custom properties
    // written by common.scss.

    var LOG = "[yodev-apex-bridge] ";
    var NODE_ID = "yodev-apex-bridge";

    function readCssVar(name) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      return v.replace(/^["']|["']$/g, "");
    }

    function settings() {
      return {
        signupPath: readCssVar("--yodev-apex-bridge-signup"),
        loginPath: readCssVar("--yodev-apex-bridge-login"),
        ref: readCssVar("--yodev-apex-bridge-ref"),
        enabled: readCssVar("--yodev-apex-bridge-enabled") === "1",
      };
    }

    // ─── Who sees this ───────────────────────────────────────────────────
    //
    // Anonymous only. A member already knows the product exists; every
    // impression should reach someone who might not.
    //
    // Gated on the PRESENCE of the login control rather than the ABSENCE of
    // #current-user. Absence is ambiguous during Ember's first paint — the
    // header may simply not have rendered yet — and that ambiguity would show
    // the CTA to logged-in members. Requiring a positive anonymous signal fails
    // the safe way: when unsure, render nothing.
    function isAnonymous() {
      return (
        !!document.querySelector(".login-button, .sign-up-button") &&
        !document.querySelector("#current-user")
      );
    }

    function isTopicPage() {
      return /^\/t\//.test(window.location.pathname || "");
    }

    // ─── Copy ────────────────────────────────────────────────────────────
    //
    // Varies by category, because a single generic message everywhere earns
    // banner-blindness fast. Grouped into four buckets rather than one string
    // per category — 23 categories would be 23 things to keep in sync, and the
    // meaningful distinction is what the reader came for, not which sub-forum
    // they landed in.
    //
    // Spanish throughout: the audience is decisively Spain, Mexico, Argentina,
    // Colombia, Chile and Peru.
    //
    // ⚠️ Deliberately EVERGREEN: no offers, no dates. A component nobody is
    // going to babysit should not carry a claim that expires.
    //
    // "Cuenta gratuita" is accurate under the single free plan (2026-09-23):
    // the account and both apps are free; worX fees apply only to contracts.
    // Neutral Spanish, tú, never voseo.
    var EYEBROW = "Gratis para devs";
    var CTA = "Crear cuenta gratis";
    var SECONDARY = "Ya tengo cuenta";
    // YOD-688: the box lists what the free account actually includes, as one
    // inline row (wraps on mobile, never stacked). "Incluye tu propio
    // workspace" read as ONE workspace; the free plan has no workspace cap.
    // Facts, verified 2026-10-05 — re-check before editing:
    //   · 10 members/workspace = Workplace features.free_plan_v1.memberLimit
    //   · no workspace-count check in createWorkspace; homepage pricing says
    //     "ilimitados"
    //   · Copilot: free plan has 20 actions + paid credits, so never "ilimitado"
    //   · the four integrations are documented in "Comenzando" (YOD-687)
    var WP_LEAD = { pre: "Y tienes ", strong: "yoDEV Workplace", post: " incluido:" };
    var WP_PERKS = [
      "Workspaces ilimitados",
      "Hasta 10 miembros por workspace",
      "Copiloto de IA (Claude)",
      "Claude Code, Linear, GitHub y Gmail integrados",
      "Docs, canvas y bases de datos en tiempo real",
    ];
    var BUCKETS = {
      ai: {
        slugs: [
          "ai-dev-tools-general", "ai-data-sci", "claude-code", "cursor",
          "github-copilot", "chatgpt-openai-dev", "gemini-code-assist",
          "windsurf-codeium", "amazon-q-developer", "aider",
          "ai-editors-app-builders", "transicion-ai",
        ],
        title: "¿Te sirvió? Recibe cada semana lo mejor en IA para programar.",
        body: "Con tu cuenta gratuita de yoDEV votas en las encuestas, preguntas a otros devs y recibes un resumen semanal.",
        lead: WP_LEAD,
        perks: WP_PERKS,
      },
      career: {
        slugs: ["trabajos-carrera", "junior-devs"],
        title: "Únete a los devs de Iberoamérica que trabajan con estructura.",
        body: "Con tu cuenta gratuita de yoDEV participas en la comunidad y recibes un resumen semanal.",
        lead: { pre: "Y accedes a ", strong: "yoDEV worX y Workplace", post: ":" },
        perks: [
          "Proyectos con alcance acordado",
          "Hitos con presupuesto",
          "Conservas el 96 %",
          "Workspaces ilimitados para tus clientes",
        ],
      },
      dev: {
        slugs: [
          "desarrollo", "frontend", "backend", "architecture",
          "cybersecurity", "code-swap",
        ],
        title: "¿Te sirvió? Sigue la conversación con otros devs.",
        body: "Con tu cuenta gratuita de yoDEV votas en las encuestas, preguntas y respondes, y recibes un resumen semanal.",
        lead: WP_LEAD,
        perks: WP_PERKS,
      },
      // general, daily-tech-feed, how-to-use-the-site, and anything added later.
      default: {
        slugs: [],
        title: "Únete a yoDEV, la comunidad de devs de Iberoamérica.",
        body: "Con tu cuenta gratuita de yoDEV votas en las encuestas, preguntas y respondes, y recibes un resumen semanal.",
        lead: WP_LEAD,
        perks: WP_PERKS,
      },
    };

    // YOD-688: one quiet line mid-article for readers who never reach the end.
    var MID = {
      text: "Gratis para devs: resumen semanal de herramientas, encuestas y workspaces ilimitados en yoDEV Workplace.",
      link: "Crear cuenta",
    };
    var MID_ID = "yodev-apex-mid";
    var MID_MIN_PARAGRAPHS = 6;

    // Discourse puts `category-<slug>` on <body> for topic pages, which is the
    // cheapest reliable read — no DOM walking, no API call, and it is already
    // there before the topic body finishes rendering.
    function categorySlug() {
      var m = /(?:^|\s)category-([a-z0-9_-]+)/i.exec(document.body.className || "");
      return m ? m[1].toLowerCase() : null;
    }

    function bucketFor(slug) {
      if (slug) {
        for (var key in BUCKETS) {
          if (BUCKETS[key].slugs.indexOf(slug) !== -1) return key;
        }
      }
      return "default";
    }

    // Same-origin paths only. Anything else (a full URL, a protocol-relative
    // "//host") is refused, so a mistyped setting can never point the CTA
    // off-site.
    function safePath(path) {
      if (!path || path.charAt(0) !== "/" || path.charAt(1) === "/") {
        console.warn(LOG + "path setting must start with a single '/'; not rendering");
        return null;
      }
      return path;
    }

    // Discourse drops ?ref= on the way through signup, so the click is the
    // attribution signal. Requires a "CTA Click" custom-event goal in
    // Plausible; without it the event is sent but not shown.
    function trackClick(ref, bucket, target) {
      try {
        if (typeof window.plausible === "function") {
          window.plausible("CTA Click", {
            props: { placement: ref || "unknown", bucket: bucket, target: target },
          });
        }
      } catch (err) {
        // Tracking must never block the navigation.
      }
    }

    // ─── Render ──────────────────────────────────────────────────────────

    function remove() {
      [NODE_ID, MID_ID].forEach(function (id) {
        var existing = document.getElementById(id);
        if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
      });
    }

    // Markup mirrors the forum banners (eyebrow / title / body / actions) so
    // the shared visual language in common.scss applies one-to-one.
    function build(copy, bucket, signupHref, loginHref, ref) {
      var box = document.createElement("aside");
      box.id = NODE_ID;
      box.className = "yodev-apex-bridge";

      var content = document.createElement("div");
      content.className = "yodev-apex-bridge__content";

      var eyebrow = document.createElement("p");
      eyebrow.className = "yodev-apex-bridge__eyebrow";
      eyebrow.textContent = EYEBROW;

      var h = document.createElement("p");
      h.className = "yodev-apex-bridge__title";
      h.setAttribute("role", "heading");
      h.setAttribute("aria-level", "2");
      h.textContent = copy.title;

      var p = document.createElement("p");
      p.className = "yodev-apex-bridge__body";
      p.textContent = copy.body;
      if (copy.lead) {
        p.appendChild(document.createTextNode(" " + copy.lead.pre));
        var strong = document.createElement("strong");
        strong.textContent = copy.lead.strong;
        p.appendChild(strong);
        p.appendChild(document.createTextNode(copy.lead.post));
      }

      var perks = null;
      if (copy.perks && copy.perks.length) {
        perks = document.createElement("ul");
        perks.className = "yodev-apex-bridge__perks";
        copy.perks.forEach(function (text) {
          var li = document.createElement("li");
          li.textContent = text;
          perks.appendChild(li);
        });
      }

      var actions = document.createElement("div");
      actions.className = "yodev-apex-bridge__actions";

      // Same-tab on purpose: signup happens on this forum, and the reader
      // comes back to the article they were on.
      var a = document.createElement("a");
      a.className = "yodev-apex-bridge__cta";
      a.href = signupHref;
      a.appendChild(document.createTextNode(CTA + " "));
      var arrow = document.createElement("span");
      arrow.className = "yodev-apex-bridge__arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "\u2192";
      a.appendChild(arrow);
      a.addEventListener("click", function () { trackClick(ref, bucket, "signup"); });
      actions.appendChild(a);

      if (loginHref) {
        var l = document.createElement("a");
        l.className = "yodev-apex-bridge__secondary";
        l.href = loginHref;
        l.textContent = SECONDARY;
        l.addEventListener("click", function () { trackClick(ref, bucket, "login"); });
        actions.appendChild(l);
      }

      content.appendChild(eyebrow);
      content.appendChild(h);
      content.appendChild(p);
      if (perks) content.appendChild(perks);
      content.appendChild(actions);
      box.appendChild(content);
      return box;
    }

    // ─── Mid-article line (YOD-688) ──────────────────────────────────────
    //
    // A pageview is not a read: many readers never reach the end box. One
    // muted line between two TOP-LEVEL paragraphs about halfway through the
    // first post. Rules, so it never feels like an ad break:
    //   · direct children of .cooked only — never inside a list, quote, code
    //     block, poll or onebox;
    //   · both neighbours must be prose (p / h2–h4), so it never sits against
    //     a code sample, image or poll;
    //   · skipped below MID_MIN_PARAGRAPHS, where it would crowd the end box.
    function firstPostCooked() {
      return document.querySelector("#post_1 .cooked") ||
        document.querySelector('.topic-post[data-post-number="1"] .cooked');
    }

    function isProse(el) {
      return !!el && /^(P|H2|H3|H4)$/.test(el.tagName) &&
        !el.querySelector("img, iframe, video, .onebox, .poll, pre");
    }

    function midAnchor(cooked) {
      var kids = Array.prototype.slice.call(cooked.children);
      var paras = kids.filter(function (el) {
        return el.tagName === "P" && isProse(el) && (el.textContent || "").trim().length >= 40;
      });
      if (paras.length < MID_MIN_PARAGRAPHS) return null;
      // Start at the middle paragraph and walk forward to the first slot whose
      // neighbours are both prose; never past the last third.
      var start = kids.indexOf(paras[Math.floor(paras.length / 2) - 1]);
      var stop = kids.indexOf(paras[Math.floor((paras.length * 2) / 3)]);
      for (var i = start; i >= 0 && i <= stop && i < kids.length - 1; i++) {
        if (kids[i].tagName === "P" && isProse(kids[i]) && isProse(kids[i + 1])) return kids[i];
      }
      return null;
    }

    function buildMid(signupHref, bucket) {
      var aside = document.createElement("aside");
      aside.id = MID_ID;
      aside.className = "yodev-apex-mid";
      aside.setAttribute("aria-label", EYEBROW);
      var icon = document.createElement("span");
      icon.className = "yodev-apex-mid__icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = "\uD83D\uDCA1";
      aside.appendChild(icon);
      aside.appendChild(document.createTextNode(MID.text + " "));
      var a = document.createElement("a");
      a.className = "yodev-apex-mid__link";
      a.href = signupHref;
      a.textContent = MID.link + " \u2192";
      a.addEventListener("click", function () { trackClick("comm-topic-mid", bucket, "signup"); });
      aside.appendChild(a);
      return aside;
    }

    // Returns true once the mid line is placed OR there is nowhere to place it
    // (short article), so the caller can stop polling.
    function renderMid(signupHref, bucket) {
      if (document.getElementById(MID_ID)) return true;
      var cooked = firstPostCooked();
      if (!cooked || !cooked.children.length) return false; // not rendered yet
      var anchor = midAnchor(cooked);
      if (!anchor) return true;
      anchor.parentNode.insertBefore(buildMid(signupHref, bucket), anchor.nextSibling);
      midWanted = true;
      return true;
    }

    // Discourse "cloaks" posts that scroll far off-screen and re-renders them
    // when they come back (measured 2026-10-05: removal via
    // .post-stream--cloaked), which wipes anything inserted into the post.
    // Re-place the line when that happens. One observer for the page's life,
    // throttled to one check per animation frame, and a no-op unless this is a
    // topic page for an anonymous reader whose article qualified.
    var midWanted = false;
    var midFrame = 0;
    function watchCloaking() {
      if (typeof MutationObserver !== "function") return;
      new MutationObserver(function () {
        if (!midWanted || midFrame) return;
        midFrame = window.requestAnimationFrame(function () {
          midFrame = 0;
          if (!midWanted || document.getElementById(MID_ID)) return;
          if (!isTopicPage() || !isAnonymous()) return;
          var s = settings();
          var href = s.enabled && s.signupPath ? safePath(s.signupPath) : null;
          if (href) renderMid(href, bucketFor(categorySlug()));
        });
      }).observe(document.body, { childList: true, subtree: true });
    }

    // "Above suggested" — the reader has finished and is deciding what is next,
    // which is the moment worth spending. `.more-topics__container` is the
    // suggested/related block on Discourse 2026.8; the footer buttons are the
    // fallback if that markup changes.
    function insertionPoint() {
      var suggested = document.querySelector(".more-topics__container");
      if (suggested && suggested.parentNode) {
        return { parent: suggested.parentNode, before: suggested };
      }
      var footer = document.getElementById("topic-footer-buttons");
      if (footer && footer.parentNode) {
        return { parent: footer.parentNode, before: footer.nextSibling };
      }
      return null;
    }

    // The insertion point sits in the wide container that also holds the
    // suggested topics (1104px on a 1440 desktop). Line the box up with the
    // topic column — the title card and posts card (976px at x=304) —
    // measured live: the same rule the forum banners use, so every card on a
    // topic page shares one left and right edge.
    function alignToPost() {
      var box = document.getElementById(NODE_ID);
      var ref = document.querySelector("#topic-title") ||
        document.querySelector(".posts-wrapper");
      if (!box || !ref || !box.parentNode) return;
      box.style.marginLeft = "";
      box.style.maxWidth = "";
      var parent = box.parentNode.getBoundingClientRect();
      var post = ref.getBoundingClientRect();
      var offset = Math.round(post.left - parent.left);
      if (post.width <= 0 || offset < 0 || post.width > parent.width) return;
      box.style.marginLeft = offset + "px";
      box.style.maxWidth = Math.round(post.width) + "px";
    }

    var resizeTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(alignToPost, 150);
    });

    var pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    // Returns true when there is nothing left to do (both placed, or not
    // applicable), so the poller can stop.
    function render() {
      var s = settings();
      if (!s.enabled || !s.signupPath) return true;
      if (!isTopicPage() || !isAnonymous()) return false;

      var bucket = bucketFor(categorySlug());
      var signupHref = safePath(s.signupPath);
      if (!signupHref) return true;

      var midDone = renderMid(signupHref, bucket);

      if (!document.getElementById(NODE_ID)) {
        var point = insertionPoint();
        if (!point) return false; // Ember renders the topic asynchronously
        var loginHref = s.loginPath ? safePath(s.loginPath) : null;
        point.parent.insertBefore(
          build(BUCKETS[bucket], bucket, signupHref, loginHref, s.ref),
          point.before
        );
        alignToPost();
        console.log(LOG + "rendered for category '" + (categorySlug() || "unknown") + "'");
      }
      return midDone;
    }

    // Ember renders the topic after the route resolves, so the insertion point
    // is not there on the first tick. Poll briefly, then give up rather than
    // spin forever on a page that will never have one.
    function renderWhenReady() {
      stopPolling();
      if (render() && document.getElementById(NODE_ID)) return;
      var elapsed = 0;
      pollTimer = setInterval(function () {
        elapsed += 250;
        var done = render();
        if ((done && document.getElementById(NODE_ID)) || elapsed >= 10000) stopPolling();
      }, 250);
    }

    // ─── SPA navigation ──────────────────────────────────────────────────
    //
    // Discourse is an Ember SPA: moving between topics fires no page load, so a
    // script that runs once at boot renders on the first topic and never again
    // — and, worse, leaves a stale CTA attached when the reader navigates to a
    // page that should not have one. This is the YOD-492 lesson, learned on the
    // beta-offer component.
    // YOD-688: Discourse calls replaceState while the reader SCROLLS (the URL
    // tracks the post number: /t/slug/123/7). Re-rendering on every call tore
    // the box down and rebuilt it mid-read — harmless for the end box, but it
    // would make the mid-article line jump under the reader. Only a change of
    // page (a different topic, or leaving topics) re-renders now.
    function pageKey() {
      var m = /^\/t\/[^/]+\/(\d+)/.exec(window.location.pathname || "");
      return m ? "t:" + m[1] : "p:" + (window.location.pathname || "");
    }
    var lastKey = pageKey();

    function onRouteChanged() {
      var key = pageKey();
      if (key === lastKey) return;
      lastKey = key;
      midWanted = false;
      remove();
      renderWhenReady();
    }

    ["pushState", "replaceState"].forEach(function (method) {
      var original = history[method];
      history[method] = function () {
        var result = original.apply(this, arguments);
        // Let Ember swap the DOM before looking for the insertion point.
        window.setTimeout(onRouteChanged, 0);
        return result;
      };
    });
    window.addEventListener("popstate", onRouteChanged);

    function boot() {
      watchCloaking();
      renderWhenReady();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
