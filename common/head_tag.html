<script>
  (function () {
    // yoDEV Apex Bridge — YOD-479, reworked in YOD-671.
    //
    // YOD-671 (2026-10-02): the CTA now asks for an ACCOUNT, in place, instead
    // of sending the reader to the homepage. Signups had sat at ~20/month
    // (~0.2% of pageviews) for four months; a reader who just finished an
    // article wants more of this, not a product tour. Community value leads,
    // the product is the second line. A forum signup IS a yoDEV account.
    //
    // ~439 anonymous readers a month reach the community from Google, read an
    // article, and leave without learning the product exists. The apex is
    // indexed and healthy but ranks for nothing, because its sitemap holds one
    // URL and nothing has ever pointed at it. This puts a contextual CTA at the
    // end of a topic, for anonymous readers only.
    //
    // Deliberately NOT a redirect. Post URLs must keep landing on the post: the
    // ranking belongs to the article's content, and intercepting search traffic
    // would forfeit it and read as cloaking.
    //
    // Built as manual DOM injection rather than `api.renderInOutlet`, because
    // `<script type="text/discourse-plugin">` was found not to execute on this
    // Discourse setup — the same reason the beta-offer and activation-redirect
    // components inject directly. Settings arrive via CSS custom properties
    // written by common.scss.

    var LOG = "[yodev-apex-bridge] ";
    var NODE_ID = "yodev-apex-bridge";

    function readCssVar(name) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      return v.replace(/^["']|["']$/g, "");
    }

    function settings() {
      return {
        signupPath: readCssVar("--yodev-apex-bridge-signup"),
        loginPath: readCssVar("--yodev-apex-bridge-login"),
        ref: readCssVar("--yodev-apex-bridge-ref"),
        enabled: readCssVar("--yodev-apex-bridge-enabled") === "1",
      };
    }

    // ─── Who sees this ───────────────────────────────────────────────────
    //
    // Anonymous only. A member already knows the product exists; every
    // impression should reach someone who might not.
    //
    // Gated on the PRESENCE of the login control rather than the ABSENCE of
    // #current-user. Absence is ambiguous during Ember's first paint — the
    // header may simply not have rendered yet — and that ambiguity would show
    // the CTA to logged-in members. Requiring a positive anonymous signal fails
    // the safe way: when unsure, render nothing.
    function isAnonymous() {
      return (
        !!document.querySelector(".login-button, .sign-up-button") &&
        !document.querySelector("#current-user")
      );
    }

    function isTopicPage() {
      return /^\/t\//.test(window.location.pathname || "");
    }

    // ─── Copy ────────────────────────────────────────────────────────────
    //
    // Varies by category, because a single generic message everywhere earns
    // banner-blindness fast. Grouped into four buckets rather than one string
    // per category — 23 categories would be 23 things to keep in sync, and the
    // meaningful distinction is what the reader came for, not which sub-forum
    // they landed in.
    //
    // Spanish throughout: the audience is decisively Spain, Mexico, Argentina,
    // Colombia, Chile and Peru.
    //
    // ⚠️ Deliberately EVERGREEN: no offers, no dates. A component nobody is
    // going to babysit should not carry a claim that expires.
    //
    // "Cuenta gratuita" is accurate under the single free plan (2026-09-23):
    // the account and both apps are free; worX fees apply only to contracts.
    // Neutral Spanish, tú, never voseo.
    var CTA = "Crear cuenta gratis";
    var SECONDARY = "Ya tengo cuenta";
    var BUCKETS = {
      ai: {
        slugs: [
          "ai-dev-tools-general", "ai-data-sci", "claude-code", "cursor",
          "github-copilot", "chatgpt-openai-dev", "gemini-code-assist",
          "windsurf-codeium", "amazon-q-developer", "aider",
          "ai-editors-app-builders", "transicion-ai",
        ],
        title: "¿Te sirvió? Recibe cada semana lo mejor en IA para programar.",
        body: "Con tu cuenta gratuita de yoDEV votas en las encuestas, preguntas a otros devs y recibes un resumen semanal con las herramientas que vale la pena probar. Incluye tu propio workspace en yoDEV Workplace, que Claude Code puede leer y actualizar desde la terminal.",
      },
      career: {
        slugs: ["trabajos-carrera", "junior-devs"],
        title: "Únete a los devs de Iberoamérica que trabajan con estructura.",
        body: "Con tu cuenta gratuita de yoDEV participas en la comunidad, recibes un resumen semanal y accedes a yoDEV worX: proyectos freelance con alcance acordado, hitos con presupuesto y pago tras la aprobación.",
      },
      dev: {
        slugs: [
          "desarrollo", "frontend", "backend", "architecture",
          "cybersecurity", "code-swap",
        ],
        title: "¿Te sirvió? Sigue la conversación con otros devs.",
        body: "Con tu cuenta gratuita de yoDEV votas en las encuestas, preguntas y respondes, y recibes un resumen semanal. Incluye tu propio workspace en yoDEV Workplace: documentos, canvas y bases de datos en tiempo real.",
      },
      // general, daily-tech-feed, how-to-use-the-site, and anything added later.
      default: {
        slugs: [],
        title: "Únete a yoDEV, la comunidad de devs de Iberoamérica.",
        body: "Con tu cuenta gratuita votas en las encuestas, preguntas a otros devs y recibes cada semana un resumen con lo mejor de la comunidad. La misma cuenta te da acceso a yoDEV Workplace y yoDEV worX.",
      },
    };

    // Discourse puts `category-<slug>` on <body> for topic pages, which is the
    // cheapest reliable read — no DOM walking, no API call, and it is already
    // there before the topic body finishes rendering.
    function categorySlug() {
      var m = /(?:^|\s)category-([a-z0-9_-]+)/i.exec(document.body.className || "");
      return m ? m[1].toLowerCase() : null;
    }

    function bucketFor(slug) {
      if (slug) {
        for (var key in BUCKETS) {
          if (BUCKETS[key].slugs.indexOf(slug) !== -1) return key;
        }
      }
      return "default";
    }

    // Same-origin paths only. Anything else (a full URL, a protocol-relative
    // "//host") is refused, so a mistyped setting can never point the CTA
    // off-site.
    function safePath(path) {
      if (!path || path.charAt(0) !== "/" || path.charAt(1) === "/") {
        console.warn(LOG + "path setting must start with a single '/'; not rendering");
        return null;
      }
      return path;
    }

    // Discourse drops ?ref= on the way through signup, so the click is the
    // attribution signal. Requires a "CTA Click" custom-event goal in
    // Plausible; without it the event is sent but not shown.
    function trackClick(ref, bucket, target) {
      try {
        if (typeof window.plausible === "function") {
          window.plausible("CTA Click", {
            props: { placement: ref || "unknown", bucket: bucket, target: target },
          });
        }
      } catch (err) {
        // Tracking must never block the navigation.
      }
    }

    // ─── Render ──────────────────────────────────────────────────────────

    function remove() {
      var existing = document.getElementById(NODE_ID);
      if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
    }

    function build(copy, bucket, signupHref, loginHref, ref) {
      var box = document.createElement("aside");
      box.id = NODE_ID;
      box.className = "yodev-apex-bridge";

      var h = document.createElement("p");
      h.className = "yodev-apex-bridge__title";
      h.textContent = copy.title;

      var p = document.createElement("p");
      p.className = "yodev-apex-bridge__body";
      p.textContent = copy.body;

      // Same-tab on purpose: signup happens on this forum, and the reader
      // comes back to the article they were on.
      var a = document.createElement("a");
      a.className = "yodev-apex-bridge__cta";
      a.href = signupHref;
      a.textContent = CTA;
      a.addEventListener("click", function () { trackClick(ref, bucket, "signup"); });

      box.appendChild(h);
      box.appendChild(p);
      box.appendChild(a);

      if (loginHref) {
        var l = document.createElement("a");
        l.className = "yodev-apex-bridge__secondary";
        l.href = loginHref;
        l.textContent = SECONDARY;
        l.addEventListener("click", function () { trackClick(ref, bucket, "login"); });
        box.appendChild(l);
      }
      return box;
    }

    // "Above suggested" — the reader has finished and is deciding what is next,
    // which is the moment worth spending. `.more-topics__container` is the
    // suggested/related block on Discourse 2026.8; the footer buttons are the
    // fallback if that markup changes.
    function insertionPoint() {
      var suggested = document.querySelector(".more-topics__container");
      if (suggested && suggested.parentNode) {
        return { parent: suggested.parentNode, before: suggested };
      }
      var footer = document.getElementById("topic-footer-buttons");
      if (footer && footer.parentNode) {
        return { parent: footer.parentNode, before: footer.nextSibling };
      }
      return null;
    }

    var pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function render() {
      var s = settings();
      if (!s.enabled || !s.signupPath) return;
      if (!isTopicPage() || !isAnonymous()) return;
      if (document.getElementById(NODE_ID)) return;

      var point = insertionPoint();
      if (!point) return; // caller polls; Ember renders the topic asynchronously

      var bucket = bucketFor(categorySlug());
      var signupHref = safePath(s.signupPath);
      if (!signupHref) return;
      var loginHref = s.loginPath ? safePath(s.loginPath) : null;

      point.parent.insertBefore(
        build(BUCKETS[bucket], bucket, signupHref, loginHref, s.ref),
        point.before
      );
      stopPolling();
      console.log(LOG + "rendered for category '" + (categorySlug() || "unknown") + "'");
    }

    // Ember renders the topic after the route resolves, so the insertion point
    // is not there on the first tick. Poll briefly, then give up rather than
    // spin forever on a page that will never have one.
    function renderWhenReady() {
      stopPolling();
      render();
      if (document.getElementById(NODE_ID)) return;
      var elapsed = 0;
      pollTimer = setInterval(function () {
        elapsed += 250;
        render();
        if (document.getElementById(NODE_ID) || elapsed >= 10000) stopPolling();
      }, 250);
    }

    // ─── SPA navigation ──────────────────────────────────────────────────
    //
    // Discourse is an Ember SPA: moving between topics fires no page load, so a
    // script that runs once at boot renders on the first topic and never again
    // — and, worse, leaves a stale CTA attached when the reader navigates to a
    // page that should not have one. This is the YOD-492 lesson, learned on the
    // beta-offer component.
    function onRouteChanged() {
      remove();
      renderWhenReady();
    }

    ["pushState", "replaceState"].forEach(function (method) {
      var original = history[method];
      history[method] = function () {
        var result = original.apply(this, arguments);
        // Let Ember swap the DOM before looking for the insertion point.
        window.setTimeout(onRouteChanged, 0);
        return result;
      };
    });
    window.addEventListener("popstate", onRouteChanged);

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", renderWhenReady);
    } else {
      renderWhenReady();
    }
  })();
</script>
