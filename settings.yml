signup_path:
  type: string
  default: "/signup"
  description:
    en: "Forum path the primary CTA opens (Discourse's own signup). Must start with '/'. Blank disables the component entirely. YOD-671: signup happens in place on the forum, which creates the same yoDEV account as the homepage."

login_path:
  type: string
  default: "/login"
  description:
    en: "Forum path for the secondary 'Ya tengo cuenta' link. Must start with '/'."

ref_value:
  type: string
  default: "comm-topic-end"
  description:
    en: "Placement name sent as the `placement` prop of the Plausible 'CTA Click' event. Discourse does not keep ?ref= through signup, so attribution is the click event plus Discourse's own signup counts."

enabled:
  type: bool
  default: true
  description:
    en: "Render the CTA. Turn off to remove it without uninstalling the component."
